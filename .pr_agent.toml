# Own Your PR Reviewer: PR-Agent defaults for a controllable PR review helper. Docs:
# https://qodo-merge-docs.qodo.ai/usage-guide/automations_and_usage/

[config]
temperature = 0.2
duplicate_prompt_examples = true
custom_model_max_tokens = 256000
max_model_tokens = 128000

# Provider behavior for LiteLLM.
# DeepSeek is the default in the example workflow because it is inexpensive.
# You can switch providers by changing the workflow model names and secrets.
[litellm]
drop_params = true

# Lightweight "what this PR does" overview.
# This posts as a comment so the action does not rewrite the PR title or body.
[pr_description]
publish_description_as_comment = true
add_original_user_description = false
final_update_message = false
use_bullet_points = true
enable_pr_type = false
enable_pr_diagram = false
include_generated_by_header = false
collapsible_file_list = true
collapsible_file_list_threshold = 1
inline_file_summary = "table"
extra_instructions = """
Write a lightweight pull request overview, not a full code review. Start with the heading
"## Pull request overview". Use one short paragraph, then a "**Changes:**" list with 3 to 6 bullets
depending on PR size. Add brief reviewer focus areas based only on the PR diff, changed file list,
and PR body. Avoid verdict language like "no issues found". Include a testing note only when it is
clear from touched test files, workflow files, package files, or the PR body.
"""

[pr_reviewer]
num_max_findings = 12
require_security_review = true
require_tests_review = true
extra_instructions = """
Review for correctness, edge cases, security-sensitive changes, tests, and maintainability. Prefer
concise, actionable inline feedback where GitHub allows it. Use the summary for broader themes,
risk, and anything that does not fit cleanly inline.
"""

[pr_code_suggestions]
# Committable suggestion blocks in the diff when the provider supports them.
commitable_code_suggestions = true
# The workflow can override these with AI_PR_REVIEW_MODE.
num_code_suggestions_per_chunk = 4
suggestions_score_threshold = 0
focus_only_on_problems = true
extra_instructions = """
Focus on real correctness bugs, edge cases, missing data flow, test gaps, security-sensitive
changes, and quick safe fixes. Skip style churn, subjective nits, and broad refactors. Generate
apply-ready committable suggestions only when the fix is small, obvious, and low-risk. For larger
or less obvious issues, leave a brief explanatory inline comment instead of inventing a patch. Do
not force a suggestion for every comment.
"""
