# Provider-flexible reference example.
# This file shows the shape to edit, not a provider-complete workflow.
# It is not ready to run until you replace placeholders with real provider values.
name: AI PR Reviewer

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

jobs:
  pr_agent:
    if: >-
      ${{
        vars.AI_PR_REVIEW_ENABLED != 'false' &&
        github.event.sender.type != 'Bot' &&
        (
          github.event_name == 'pull_request' ||
          (
            github.event_name == 'issue_comment' &&
            github.event.issue.pull_request &&
            startsWith(github.event.comment.body, '/')
          )
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Optional:
      #   AI_PR_REVIEW_ENABLED=false pauses this workflow.
      #   AI_PR_REVIEW_MODE=light|balanced|deep can be wired like the full template.
      # Slash-command comments must start with / to run the manual step.

      # Replace the next line with the provider-specific key mapping required
      # by PR-Agent and LiteLLM. Do not assume every provider uses the same
      # secret or environment variable name.
      #
      # Example shape only:
      # PROVIDER.KEY: ${{ secrets.YOUR_PROVIDER_API_KEY }}

      # Keep fallback models aligned with the provider credentials above.
      config.fallback_models: '["provider/cheap-or-fast-model"]'

    steps:
      - name: Automatic cheap review
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
        # Pinned for stability. Update intentionally after testing.
        uses: Codium-ai/pr-agent@0e37fc84fcc8207561e64eef8f7f634fb57e8447
        env:
          # Use a cheaper/faster model here because this can run often.
          config.model: "provider/cheap-or-fast-model"
          github_action_config.auto_describe: "true"
          github_action_config.auto_review: "false"
          github_action_config.auto_improve: "true"

      - name: Manual stronger review
        if: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/') }}
        # Pinned for stability. Update intentionally after testing.
        uses: Codium-ai/pr-agent@0e37fc84fcc8207561e64eef8f7f634fb57e8447
        env:
          # Use a stronger model here because a person chooses when to run it.
          config.model: "provider/stronger-review-model"
          config.fallback_models: '["provider/stronger-review-model"]'
          github_action_config.auto_describe: "false"
          github_action_config.auto_review: "false"
          github_action_config.auto_improve: "false"
